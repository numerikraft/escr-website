<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#181126" />
      <stop offset="100%" stop-color="#07050a" />
    </radialGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7F2191" />
      <stop offset="100%" stop-color="#50298E" />
    </linearGradient>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(127, 33, 145, 0.07)" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGlow)" />
  <rect width="1200" height="675" fill="url(#gridPattern)" />

  <!-- Outer Border Frame -->
  <rect x="24" y="24" width="1152" height="627" rx="16" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" />
  <rect x="36" y="36" width="1128" height="603" rx="10" fill="none" stroke="rgba(127, 33, 145, 0.18)" stroke-width="1" stroke-dasharray="4 4" />

  <!-- Top Header Bar -->
  <g transform="translate(60, 60)">
    <!-- Brand Tag -->
    <rect x="0" y="0" width="160" height="30" rx="15" fill="rgba(127, 33, 145, 0.2)" stroke="rgba(127, 33, 145, 0.4)" stroke-width="1" />
    <text x="80" y="19" fill="#E2DCED" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" text-anchor="middle">ES-CR BRAND</text>

    <!-- Category -->
    <text x="1080" y="20" fill="rgba(255, 255, 255, 0.45)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" letter-spacing="1" text-anchor="end">LEGAL & REGULATORY</text>
  </g>

  <!-- Center Icon & Information -->
  <g transform="translate(600, 310)">
    <!-- Icon Circle Glow -->
    <circle cx="0" cy="-60" r="54" fill="rgba(80, 41, 142, 0.25)" stroke="url(#purpleGrad)" stroke-width="2" />
    
    <!-- Deliverable Specific Icon -->
    <g transform="translate(-24, -84) scale(2)" stroke="#ffffff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M10 13a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z"/><path d="m14 21-1.5-3"/>
    </g>

    <!-- Main Title -->
    <text x="0" y="36" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="700" letter-spacing="-0.5" text-anchor="middle">Contrat d'Étude Clinique (CTA)</text>
    
    <!-- Specs / Dimensions -->
    <text x="0" y="68" fill="rgba(226, 220, 237, 0.7)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" letter-spacing="0.5" text-anchor="middle">Clinical Trial Agreement · Format A4</text>

    <!-- Placeholder Status Pill -->
    <rect x="-130" y="100" width="260" height="32" rx="16" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
    <circle cx="-100" cy="116" r="4" fill="#7F2191" />
    <text x="-88" y="121" fill="rgba(255, 255, 255, 0.65)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="1">MOCKUP PLACEHOLDER</text>
  </g>

  <!-- Bottom Details Bar -->
  <g transform="translate(60, 605)">
    <text x="0" y="0" fill="rgba(255, 255, 255, 0.35)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500">ES Clinical Research &middot; Official Brandbook Assets</text>
    <text x="1080" y="0" fill="rgba(255, 255, 255, 0.35)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" text-anchor="end">Replace with final photograph / mockup</text>
  </g>
</svg>