name: 🏗️ Build & Update dist for cPanel

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'dist/**'   # avoid infinite loop when dist is committed back

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build + Prerender (SEO)
        run: npm run build

      - name: 📤 Commit dist/ to GitHub
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/ --force
          git diff --staged --quiet || git commit -m "build: update dist/ [skip ci]"
          git push origin main
