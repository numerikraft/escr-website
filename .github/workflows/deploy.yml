name: 🏗️ Build & Deploy to cPanel

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'dist/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build + Prerender (SEO)
        run: npm run build

      - name: 📦 Create optimized deployment archives
        run: |
          cd dist
          if [ -d "brandguideline/downloads" ]; then
            echo "📦 Packing Part 1: Site and Brandguideline UI..."
            zip -r ../part1-site.zip . -x "brandguideline/downloads/*"
            
            echo "📦 Packing Part 2: Brandguideline vector assets (Logos, Favicons, QR, Fonts, Colors)..."
            zip -r ../part2-assets.zip brandguideline/downloads/Logo brandguideline/downloads/Favicon "brandguideline/downloads/QR Code" brandguideline/downloads/Fonts brandguideline/downloads/Colors
            
            echo "📦 Packing Part 3: Brandguideline documents (Presentations, Pitch decks, Templates)..."
            find brandguideline/downloads -maxdepth 1 -type f | zip ../part3-docs.zip -@
          else
            zip -r ../part1-site.zip .
          fi
          cd ..
          ls -lh part*.zip || true

      - name: 🚀 Deploy via Direct PHP Endpoint
        run: |
          deploy_zip() {
            local zip_file="$1"
            local label="$2"
            echo "🚀 Deploying $label ($zip_file - $(du -sh "$zip_file" | cut -f1))..."
            HTTP_STATUS=$(curl -k -s -w "%{http_code}" --max-time 180 --connect-timeout 20 -o deploy_response.json \
              -H "X-Deploy-Token: esclinical_deploy_key_2026_numerikraft" \
              -F "zip_file=@$zip_file" \
              "https://${{ secrets.CPANEL_HOST }}/api-deploy.php")
            
            cat deploy_response.json || true
            echo ""
            
            if [ "$HTTP_STATUS" -eq 200 ] && grep -q '"status":1' deploy_response.json; then
              echo "✅ $label deployed successfully!"
            else
              echo "❌ $label deployment failed with HTTP status $HTTP_STATUS!"
              exit 1
            fi
          }

          if [ -f "part1-site.zip" ]; then
            deploy_zip "part1-site.zip" "Part 1 (Site + UI)"
          fi

          if [ -f "part2-assets.zip" ]; then
            deploy_zip "part2-assets.zip" "Part 2 (Vector Assets)"
          fi

          if [ -f "part3-docs.zip" ]; then
            deploy_zip "part3-docs.zip" "Part 3 (Documents & PPTX)"
          fi

      - name: 🎉 Deploy complete
        run: echo "✅ ESC Clinical Research website and brand guidelines deployed successfully!"
