name: 🏗️ Build & Deploy to cPanel

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'dist/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build + Prerender (SEO)
        run: npm run build

      - name: 📦 Zip the dist folder
        run: |
          cd dist
          zip -r ../esclinical-dist.zip .
          cd ..
          echo "✅ Zip created: $(du -sh esclinical-dist.zip)"

      - name: 🚀 Deploy via Direct PHP Endpoint or cPanel API
        run: |
          echo "Attempting deployment via Direct PHP Endpoint..."
          HTTP_STATUS=$(curl -k -s -w "%{http_code}" -o deploy_response.json \
            -H "X-Deploy-Token: esclinical_deploy_key_2026_numerikraft" \
            -F "zip_file=@esclinical-dist.zip" \
            "https://${{ secrets.CPANEL_HOST }}/api-deploy.php")
          
          cat deploy_response.json || true
          echo ""

          if [ "$HTTP_STATUS" -eq 200 ] && grep -q '"status":1' deploy_response.json; then
            echo "🎉 Direct PHP Deployment succeeded!"
          else
            echo "⚠️ Direct PHP endpoint returned status $HTTP_STATUS or error. Falling back to cPanel UAPI..."
            
            AUTH_HEADER="Authorization: cpanel ${{ secrets.CPANEL_USERNAME }}:${{ secrets.CPANEL_PASSWORD }}"
            
            # 1. Upload Zip
            curl -k -s -o upload_response.json \
              -H "$AUTH_HEADER" \
              --user "${{ secrets.CPANEL_USERNAME }}:${{ secrets.CPANEL_PASSWORD }}" \
              -F "dir=/public_html" \
              -F "file-1=@esclinical-dist.zip" \
              "https://${{ secrets.CPANEL_HOST }}:2083/execute/Fileman/upload_files"
            
            cat upload_response.json || true
            echo ""
            
            if ! grep -q '"status":1' upload_response.json; then
              echo "❌ Upload failed via cPanel UAPI as well!"
              exit 1
            fi

            # 2. Extract Archive
            curl -k -s -o extract_response.json \
              -H "$AUTH_HEADER" \
              --user "${{ secrets.CPANEL_USERNAME }}:${{ secrets.CPANEL_PASSWORD }}" \
              -G \
              --data-urlencode "dest=/public_html" \
              --data-urlencode "file=/public_html/esclinical-dist.zip" \
              "https://${{ secrets.CPANEL_HOST }}:2083/execute/Fileman/extract_an_archive"
            
            cat extract_response.json || true
            echo ""

            if ! grep -q '"status":1' extract_response.json; then
              echo "❌ Extraction failed!"
              exit 1
            fi

            # 3. Delete Zip
            curl -k -s \
              -H "$AUTH_HEADER" \
              --user "${{ secrets.CPANEL_USERNAME }}:${{ secrets.CPANEL_PASSWORD }}" \
              -G \
              --data-urlencode "files[]=/public_html/esclinical-dist.zip" \
              "https://${{ secrets.CPANEL_HOST }}:2083/execute/Fileman/delete_files"
            
            echo "🗑️ Server cleanup completed."
          fi

      - name: 🎉 Deploy complete
        run: echo "✅ ESC Clinical Research website deployed successfully!"
