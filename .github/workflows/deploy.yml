name: 🏗️ Build & Deploy to cPanel (HTTPS API)

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'dist/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build + Prerender (SEO)
        run: npm run build

      - name: 📦 Zip the dist folder
        run: |
          cd dist
          zip -r ../esclinical-dist.zip .
          cd ..
          echo "Zip created: $(du -sh esclinical-dist.zip)"

      - name: 🚀 Upload zip to cPanel via HTTPS API
        run: |
          curl -k -s -o upload_response.json \
            --user "${{ secrets.CPANEL_USERNAME }}:${{ secrets.CPANEL_PASSWORD }}" \
            -F "dir=/public_html" \
            -F "file-1=@esclinical-dist.zip" \
            "https://${{ secrets.CPANEL_HOST }}:2083/execute/Fileman/upload_files"
          cat upload_response.json

      - name: 📂 Extract zip in public_html via cPanel API
        run: |
          curl -k -s -o extract_response.json \
            --user "${{ secrets.CPANEL_USERNAME }}:${{ secrets.CPANEL_PASSWORD }}" \
            -G \
            --data-urlencode "dest=/public_html" \
            --data-urlencode "file=/public_html/esclinical-dist.zip" \
            "https://${{ secrets.CPANEL_HOST }}:2083/execute/Fileman/extract_an_archive"
          cat extract_response.json

      - name: 🗑️ Delete zip from server
        run: |
          curl -k -s \
            --user "${{ secrets.CPANEL_USERNAME }}:${{ secrets.CPANEL_PASSWORD }}" \
            -G \
            --data-urlencode "files[]=/public_html/esclinical-dist.zip" \
            "https://${{ secrets.CPANEL_HOST }}:2083/execute/Fileman/delete_files"
          echo "Cleanup done ✅"

      - name: 📤 Commit updated dist/ to GitHub
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/ --force
          git diff --staged --quiet || git commit -m "build: update dist/ [skip ci]"
          git push origin main
